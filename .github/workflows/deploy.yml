name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/terma-premium-resort-1l96x2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Группа одна на все ветки — двух одновременных выкладок Pages быть не
# может. Но отменять начатую нельзя: пуш в main приходит через секунду
# после пуша в ветку выкладки и гасил её прогон на середине. Один раз
# из-за этого на бой не уехал готовый коммит. Второй прогон ждёт.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /termaa

      # Pages иначе прячет всё, что начинается с подчёркивания, — а там _next.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      # Корень выдачи однажды уже отдавал 404 при живом /fonts/.
      # Проверяем состав до заливки: нет корневого index.html — падаем здесь,
      # а не выясняем это на боевом адресе.
      - name: Проверить состав выдачи
        run: |
          set -e
          echo "— корень выдачи:"; ls -la out | head -20
          for f in index.html fonts/index.html favicon.svg; do
            test -s "out/$f" || { echo "НЕТ ИЛИ ПУСТО: out/$f"; exit 1; }
            echo "есть: out/$f ($(wc -c < "out/$f") Б)"
          done
          # .nojekyll пустой по определению — проверяем только наличие.
          test -f out/.nojekyll || { echo "НЕТ: out/.nojekyll"; exit 1; }
          echo "есть: out/.nojekyll"
          grep -q '<div class="hero"' out/index.html \
            || grep -q 'class="hero' out/index.html \
            || { echo "в корневом index.html нет разметки героя"; exit 1; }

      # enablement включает Pages на репозитории, если они ещё не включены,
      # и переводит источник на GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # Окружение github-pages пускает деплой только с веток, перечисленных
  # в его правиле «разрешённые ветки». Правило создаётся один раз при
  # включении Pages и сменой ветки по умолчанию НЕ переписывается —
  # поэтому здесь одно имя ветки, а не сравнение с дефолтом.
  #
  # Сравнение с дефолтом здесь уже стояло и давало красный прогон на
  # каждый пуш в main: ветка дефолтная, а окружение её не пускает, и
  # задание падало за две секунды ещё до раннера. Чинится это не в
  # workflow, а одним действием владельца:
  #   Settings → Environments → github-pages → Deployment branches,
  # добавить main. После этого имя ниже можно заменить на
  # `github.event.repository.default_branch`.
  deploy:
    needs: build
    if: github.ref_name == 'claude/terma-premium-resort-1l96x2'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Дым по живому адресу. Раннер в открытой сети, поэтому именно здесь
      # видно, что реально отдаёт Pages: корень, витрина шрифтов, стиль,
      # шрифт и кадр. Красный прогон лучше молчаливого 404 на проде.
      - name: Дым по живому адресу
        run: |
          set -u
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}/"
          echo "адрес: $BASE"
          sleep 15
          fail=0
          check () {
            url="$BASE$1"
            for try in 1 2 3 4 5; do
              code=$(curl -s -o /tmp/body -w '%{http_code}' -L "$url")
              [ "$code" = "200" ] && break
              sleep 8
            done
            size=$(wc -c < /tmp/body)
            echo "$code  $size Б  $url"
            [ "$code" = "200" ] || fail=1
          }
          check ""
          check "fonts/"
          check "favicon.svg"
          grep -qi '<title>' /tmp/body 2>/dev/null || true
          exit $fail
